
services:
  postgres:
    image: postgres:16
    container_name: wegrow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wegrow_db
      POSTGRES_USER: wegrow_user
      POSTGRES_PASSWORD: wegrow_dev_password
    ports:
      - "5433:5433"
    volumes:
      - wegrow_data:/var/lib/postgresql/data

volumes:
  wegrow_data:
